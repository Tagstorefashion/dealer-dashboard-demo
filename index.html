<div class="app" id="app">
  <img class="hero-car" src="assets/hero-car.webp" alt="" aria-hidden="true">

  <header class="top">
    <button class="burger" id="burger" aria-label="Open menu"><svg class="ic"><use href="#i-menu"/></svg></button>
    <a class="logo" href="#/dashboard" aria-label="Dubizzle × Hatla2ee dealer dashboard"><img src="assets/logo.webp" alt="dubizzle | Hatla2ee"></a>
    <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="gsearch" type="search" placeholder="Search cars, models, or ads...  (Ctrl + K)" aria-label="Search cars, models, or ads"></label>
    <div class="top-r">
      <button class="bell" id="bell" aria-label="Notifications, 3 new"><svg class="ic"><use href="#i-bell"/></svg><b>3</b></button>
      <button class="me" id="me"><img src="assets/avatar-me.webp" alt=""><span><strong>Auto World Motors</strong><small>Dealer Account <i>⌄</i></small></span></button>
    </div>
  </header>

  <aside class="side" id="side" aria-label="Main navigation">
    <nav>
      <a href="#/dashboard" data-r="dashboard"><svg class="ic"><use href="#i-home"/></svg>Dashboard</a>
      <a href="#/inventory" data-r="inventory"><svg class="ic"><use href="#i-car"/></svg>My Inventory</a>
      <a href="#/performance" data-r="performance"><svg class="ic"><use href="#i-bars"/></svg>Performance</a>
      <a href="#/leads" data-r="leads"><svg class="ic"><use href="#i-chat"/></svg>Leads &amp; Messages<em>23</em></a>

      <a href="#/support" data-r="support"><svg class="ic"><use href="#i-head"/></svg>Support</a>
    </nav>
    <div class="upgrade">
      <svg class="ic crown"><use href="#i-crown"/></svg>
      <h4>Upgrade to<br>Premium Dealer</h4>
      <p>Get more visibility,<br>more leads</p>
      <a class="btn-grad" href="#/premium">Upgrade Now <svg class="ic"><use href="#i-arrow"/></svg></a>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="view" tabindex="-1"></main>
